packages:
  - "."
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  re2: true
  sharp: true
minimumReleaseAgeExclude:
  - "@astrojs/internal-helpers@0.10.2"
  - "@astrojs/markdown-remark@7.2.2"
  - "@astrojs/mdx@7.0.5"
peerDependencyRules:
  ignoreMissing:
    # typescript toolchain is typescript-go (@typescript/native-preview);
    # @astrojs/check's classic typescript peer is intentionally unmet.
    - typescript
